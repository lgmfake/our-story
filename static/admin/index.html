<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>文章管理 · 我们的故事</title>
<style>
  :root {
    --pink: #ff6b81;
    --pink-soft: #ffe9ee;
    --text: #2b2b2b;
    --muted: #8a8a8a;
    --line: #ececec;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  button, input, textarea { font: inherit; }

  .hidden { display: none !important; }

  /* 登录 */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #fff5f7, #f7f7ff);
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 12px 40px rgba(255, 107, 129, .15);
    text-align: center;
  }
  .login-card h1 { font-size: 20px; margin: 0 0 6px; }
  .login-card p { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  .login-card input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    margin-bottom: 14px;
  }
  .login-card input:focus { border-color: var(--pink); }
  .btn {
    border: 0;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--pink);
    color: #fff;
    font-weight: 600;
    transition: .2s;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: #fff; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  .btn.wide { width: 100%; }
  .error { color: #e03131; font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* 主界面 */
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: #fff;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .topbar .brand { font-weight: 700; margin-right: auto; }
  .topbar .brand span { color: var(--pink); }
  .layout { flex: 1; display: flex; min-height: 0; }

  .sidebar {
    width: 300px;
    border-right: 1px solid var(--line);
    background: #fff;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar-head {
    padding: 14px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 13px;
  }
  .post-item {
    padding: 12px 16px;
    border-top: 1px solid #f4f4f4;
    cursor: pointer;
    transition: background .15s;
  }
  .post-item:hover { background: #fff8fa; }
  .post-item.active { background: var(--pink-soft); }
  .post-item .t { font-size: 14px; font-weight: 600; margin-bottom: 4px; word-break: break-all; }
  .post-item .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    background: #f1f3f5;
    color: #868e96;
  }
  .tag.draft { background: #fff4e6; color: #e8590c; }
  .tag.live { background: #ebfbee; color: #2f9e44; }

  .editor { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .editor-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: #fff;
    flex-wrap: wrap;
  }
  .editor-bar .path { color: var(--muted); font-size: 12px; margin-right: auto; word-break: break-all; }
  .switch { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
  .switch input { accent-color: var(--pink); width: 16px; height: 16px; }
  .editor textarea {
    flex: 1;
    border: 0;
    outline: none;
    resize: none;
    padding: 20px 22px 60px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 14px;
    line-height: 1.85;
    background: #fff;
    tab-size: 2;
  }
  .empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px;
    text-align: center;
  }
  .status { font-size: 13px; color: var(--muted); }
  .status.ok { color: #2f9e44; }
  .status.err { color: #e03131; }

  /* 新建弹窗 */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .35);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 14px;
    padding: 24px;
  }
  .modal h2 { font-size: 17px; margin: 0 0 16px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .modal input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    outline: none;
  }
  .modal input:focus { border-color: var(--pink); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .modal .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .editor textarea { padding: 16px; font-size: 13px; }
  }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login" class="login-wrap hidden">
  <form id="loginForm" class="login-card" autocomplete="on">
    <h1>文章管理</h1>
    <p>输入密码后即可编辑和发布文章</p>
    <input id="password" type="password" placeholder="密码" autocomplete="current-password" required>
    <button class="btn wide" type="submit" id="loginBtn">进入</button>
    <div class="error" id="loginError"></div>
  </form>
</div>

<!-- 主界面 -->
<div id="app" class="app hidden">
  <div class="topbar">
    <div class="brand">我们的故事 · <span>文章管理</span></div>
    <span class="status" id="status"></span>
    <button class="btn ghost" id="newBtn" type="button">新建文章</button>
    <button class="btn ghost" id="refreshBtn" type="button">刷新</button>
    <button class="btn ghost" id="logoutBtn" type="button">退出</button>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>全部文章</span>
        <span id="postCount"></span>
      </div>
      <div id="postList"></div>
    </aside>

    <section class="editor">
      <div class="editor-bar">
        <span class="path" id="currentPath">未选择文章</span>
        <label class="switch" title="勾选后保存即发布">
          <input type="checkbox" id="publishToggle" disabled>
          发布（draft: false）
        </label>
        <button class="btn" id="saveBtn" type="button" disabled>保存并发布</button>
      </div>
      <textarea id="editor" class="hidden" spellcheck="false" placeholder="在左侧选择一篇文章开始编辑……"></textarea>
      <div class="empty" id="emptyState">在左侧点击一篇文章开始编辑，或点右上角「新建文章」</div>
    </section>
  </div>
</div>

<!-- 新建弹窗 -->
<div id="newModal" class="modal-mask hidden">
  <form class="modal" id="newForm">
    <h2>新建文章</h2>
    <label for="newTitle">标题</label>
    <input id="newTitle" required placeholder="例如：今天也很喜欢你">
    <label for="newSlug">短名（网址用）</label>
    <input id="newSlug" required placeholder="小写字母/数字/短横线，如 2026-11-25-xihuan">
    <div class="hint">短名会出现在网址 /posts/短名/ 里，创建后不要再改。</div>
    <label for="newAuthor">作者</label>
    <input id="newAuthor" value="猫猫">
    <div class="actions">
      <button class="btn ghost" type="button" id="cancelNewBtn">取消</button>
      <button class="btn" type="submit" id="createBtn">创建</button>
    </div>
    <div class="error" id="createError"></div>
  </form>
</div>

<script>
(function () {
  var API = '/api/admin';

  var state = {
    posts: [],
    current: null,
    sha: '',
    dirty: false,
    saving: false
  };

  var $ = function (id) { return document.getElementById(id); };

  function setStatus(text, kind) {
    var el = $('status');
    el.textContent = text || '';
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  function api(action, data) {
    return fetch(API, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action: action }, data || {}))
    }).then(function (res) {
      return res.json().catch(function () { return { ok: false, error: '服务器返回异常（' + res.status + '）' }; })
        .then(function (json) {
          if (!json.ok && !json.error) json.error = '请求失败（' + res.status + '）';
          return json;
        });
    });
  }

  function showLogin() {
    $('login').classList.remove('hidden');
    $('app').classList.add('hidden');
    $('password').focus();
  }

  function showApp() {
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    loadPosts();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function loadPosts(selectPath) {
    setStatus('加载中…');
    api('list').then(function (res) {
      if (!res.ok) {
        if (res.error && res.error.indexOf('过期') >= 0) return showLogin();
        setStatus(res.error || '加载失败', 'err');
        return;
      }
      state.posts = res.posts || [];
      $('postCount').textContent = state.posts.length + ' 篇';
      renderList();
      setStatus('');
      if (selectPath) openPost(selectPath);
    }).catch(function () {
      setStatus('网络错误，请重试', 'err');
    });
  }

  function renderList() {
    var box = $('postList');
    box.innerHTML = '';
    state.posts.forEach(function (post) {
      var item = document.createElement('div');
      item.className = 'post-item' + (state.current === post.path ? ' active' : '');
      var badge = post.draft
        ? '<span class="tag draft">草稿</span>'
        : '<span class="tag live">已发布</span>';
      item.innerHTML =
        '<div class="t">' + escapeHtml(post.title || post.slug) + '</div>' +
        '<div class="m">' + escapeHtml((post.date || '').slice(0, 10)) + badge + '</div>';
      item.addEventListener('click', function () { openPost(post.path); });
      box.appendChild(item);
    });
  }

  function confirmDiscard() {
    return !state.dirty || window.confirm('当前文章还没保存，确定要离开吗？');
  }

  function openPost(path) {
    if (state.current === path) return;
    if (!confirmDiscard()) return;
    setStatus('读取中…');
    api('get', { path: path }).then(function (res) {
      if (!res.ok) { setStatus(res.error || '读取失败', 'err'); return; }
      state.current = res.path;
      state.sha = res.sha;
      state.dirty = false;
      $('editor').value = res.content;
      $('editor').classList.remove('hidden');
      $('emptyState').classList.add('hidden');
      $('publishToggle').disabled = false;
      $('saveBtn').disabled = false;
      syncDraftToggle(res.content);
      renderList();
      var slug = res.path.split('/')[2];
      $('currentPath').innerHTML =
        escapeHtml(res.path) +
        ' &nbsp;·&nbsp; <a href="/posts/' + encodeURIComponent(slug) + '/" target="_blank" rel="noopener" style="color:var(--pink)">查看页面</a>';
      setStatus('');
    }).catch(function () { setStatus('网络错误，请重试', 'err'); });
  }

  function draftIsFalse(text) {
    var m = /^draft:\s*(true|false)\s*$/m.exec(text);
    return m ? m[1] === 'false' : false;
  }

  function syncDraftToggle(text) {
    $('publishToggle').checked = draftIsFalse(text);
  }

  function applyDraft(text, publish) {
    var replacement = 'draft: ' + (publish ? 'false' : 'true');
    if (/^draft:\s*(true|false)\s*$/m.test(text)) {
      return text.replace(/^draft:\s*(true|false)\s*$/m, replacement);
    }
    return text.replace(/^---\r?\n/, '---\n' + replacement + '\n');
  }

  function save() {
    if (!state.current || state.saving) return;
    state.saving = true;
    $('saveBtn').disabled = true;
    setStatus('保存中…');
    var content = applyDraft($('editor').value, $('publishToggle').checked);
    $('editor').value = content;
    api('save', { path: state.current, content: content, sha: state.sha })
      .then(function (res) {
        if (!res.ok) { setStatus(res.error || '保存失败', 'err'); return; }
        state.sha = res.sha;
        state.dirty = false;
        setStatus('已保存，Vercel 正在重新构建，约 1 分钟后上线', 'ok');
        loadPosts();
      })
      .catch(function () { setStatus('网络错误，请重试', 'err'); })
      .then(function () {
        state.saving = false;
        $('saveBtn').disabled = false;
      });
  }

  // 事件绑定
  $('loginForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var btn = $('loginBtn');
    btn.disabled = true;
    $('loginError').textContent = '';
    api('login', { password: $('password').value })
      .then(function (res) {
        if (!res.ok) { $('loginError').textContent = res.error || '登录失败'; return; }
        $('password').value = '';
        showApp();
      })
      .catch(function () { $('loginError').textContent = '网络错误，请重试'; })
      .then(function () { btn.disabled = false; });
  });

  $('logoutBtn').addEventListener('click', function () {
    if (!confirmDiscard()) return;
    api('logout').then(showLogin);
  });

  $('refreshBtn').addEventListener('click', function () {
    if (!confirmDiscard()) return;
    state.current = null;
    state.dirty = false;
    $('editor').classList.add('hidden');
    $('emptyState').classList.remove('hidden');
    $('currentPath').textContent = '未选择文章';
    $('publishToggle').disabled = true;
    $('saveBtn').disabled = true;
    loadPosts();
  });

  $('saveBtn').addEventListener('click', save);

  $('publishToggle').addEventListener('change', function () {
    state.dirty = true;
    $('editor').value = applyDraft($('editor').value, $('publishToggle').checked);
  });

  $('editor').addEventListener('input', function () { state.dirty = true; });

  document.addEventListener('keydown', function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key === 's') {
      event.preventDefault();
      if (!$('app').classList.contains('hidden')) save();
    }
  });

  window.addEventListener('beforeunload', function (event) {
    if (state.dirty) {
      event.preventDefault();
      event.returnValue = '';
    }
  });

  // 新建文章
  function openNew() {
    $('newModal').classList.remove('hidden');
    $('createError').textContent = '';
    var d = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    $('newSlug').value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '-';
    $('newTitle').focus();
  }

  function closeNew() { $('newModal').classList.add('hidden'); }

  $('newBtn').addEventListener('click', openNew);
  $('cancelNewBtn').addEventListener('click', closeNew);
  $('newModal').addEventListener('click', function (event) {
    if (event.target === $('newModal')) closeNew();
  });

  $('newForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var btn = $('createBtn');
    btn.disabled = true;
    $('createError').textContent = '';
    api('create', {
      title: $('newTitle').value.trim(),
      slug: $('newSlug').value.trim(),
      author: $('newAuthor').value.trim()
    }).then(function (res) {
      if (!res.ok) { $('createError').textContent = res.error || '创建失败'; return; }
      closeNew();
      $('newTitle').value = '';
      state.current = null;
      loadPosts(res.path);
    }).catch(function () {
      $('createError').textContent = '网络错误，请重试';
    }).then(function () { btn.disabled = false; });
  });

  // 启动：检查会话
  api('session').then(function (res) {
    if (res.ok && res.authenticated) showApp();
    else showLogin();
  }).catch(showLogin);
})();
</script>
</body>
</html>
